  const activeType = (s1 && s1 !== 'driver') ? s1 : ((s2 && s2 !== 'driver') ? s2 : 'driver');
  if (activeType === 'controller') return { mode: 'control', icon: 'П', label: 'Контроль' };
  if (activeType === 'workshop') return { mode: 'workshop', icon: '⚒', label: 'Мастерская' };
  if (activeType === 'company') return { mode: 'company', icon: 'Т', label: 'Предприятие' };
  return { mode: 'work', icon: '•', label: 'Рабочий' };
}

let audioCtx = null;
function initAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
}
function vibrate(ms = 15) { if (navigator.vibrate) navigator.vibrate(ms); }

function beep(freq = 1850, dur = 0.04) {
  if (state.soundTone === 0) return;
  const toneShift = state.soundTone === 1 ? 1 : (state.soundTone === 2 ? 0.82 : 1.18);
  try {
    initAudio();
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.frequency.value = freq * toneShift;
    g.gain.value = 0.06;
    o.connect(g); g.connect(audioCtx.destination);
    o.start(); o.stop(audioCtx.currentTime + dur);
  } catch(e) {}
}

function fDur(m) {
  const val = Math.max(0, Math.floor(Number(m) || 0));
  return String(Math.floor(val / 60) % 100).padStart(2, '0') + 'ч' + String(val % 60).padStart(2, '0');
}
function fClk(m) {
  const n = ((Math.floor(m) % 1440) + 1440) % 1440;
  return String(Math.floor(n / 60)).padStart(2, '0') + ':' + String(n % 60).padStart(2, '0');
}

function triggerAlert(line1, line2, code = null, autoClearMs = 0) {
  wakeUp(false);
  state.alertActive = true;
  state.alertLatched = false;
  state.alertLine1 = line1;
  state.alertLine2 = line2;
  if (code) {
    state.eventLog.unshift({
      date: state.fullDate, time: fClk(state.clock),
      code: code, dur: '00ч01', msg: errorCodes[code] || line1
    });
  }
  document.getElementById('ledIndicator').classList.add('blink');
  beep(1200, 0.15);
  if (state.alertBeepInterval) clearInterval(state.alertBeepInterval);
  if (state.alertTimeout) clearTimeout(state.alertTimeout);

  if (autoClearMs > 0) {
    state.alertTimeout = setTimeout(() => { clearAlert(); }, autoClearMs);
  } else {
    state.alertBeepInterval = setInterval(() => {
      beep(1350, 0.12);
      setTimeout(() => beep(980, 0.12), 180);
    }, 1800);
    // По п. 11.1.2: через 30 секунд световая и звуковая индикация гаснет, сообщение фиксируется на экране до нажатия OK
    state.alertTimeout = setTimeout(() => { silenceAlertBuzzer(); }, 30000);
  }
  render();
}

function silenceAlertBuzzer() {
  state.alertLatched = true;
  if (state.alertBeepInterval) { clearInterval(state.alertBeepInterval); state.alertBeepInterval = null; }
  if (state.alertTimeout) { clearTimeout(state.alertTimeout); state.alertTimeout = null; }
  document.getElementById('ledIndicator').classList.remove('blink');
  render();
}

function clearAlert() {
  silenceAlertBuzzer();
  state.alertActive = false;
  state.alertLatched = false;
  render();
}

function resetSleepTimer() {
  if (state.sleepTimer1) clearTimeout(state.sleepTimer1);
  if (state.sleepTimer2) clearTimeout(state.sleepTimer2);
  if (state.sleepStage > 0) return;
  // По п. 11.1.3: при отключенном зажигании через 25 секунд гаснет подсветка и выводится www.nrdrive.ru
  state.sleepTimer1 = setTimeout(() => {
    if (!state.ignition && !state.driving && !state.alertActive) {
      state.sleepStage = 1;
      render();
      state.sleepTimer2 = setTimeout(() => {
        if (!state.ignition && !state.driving) {
          state.sleepStage = 2;
          render();
        }
      }, 420000);
    }
  }, 25000);
}

function wakeUp(playBeep = true) {
  if (state.sleepStage > 0) {
    state.sleepStage = 0;
    if (playBeep) { initAudio(); beep(1650, 0.06); vibrate(); }
  }
  resetSleepTimer();
  render();
}

function render() {
  const r1 = document.getElementById('row1'), r2 = document.getElementById('row2'), lcd = document.getElementById('lcdScreen');
  const t1 = getSlotType(1), t2 = getSlotType(2);
  document.getElementById('slot1').className = 'card-slot' + (t1 ? ' active' : '') + (t1 === 'controller' ? ' ctrl' : t1 === 'workshop' ? ' ws' : t1 === 'company' ? ' comp' : '');
  document.getElementById('slot2').className = 'card-slot' + (t2 ? ' active' : '') + (t2 === 'controller' ? ' ctrl' : t2 === 'workshop' ? ' ws' : t2 === 'company' ? ' comp' : '');

  lcd.className = 'lcd-screen';
  lcd.style.background = backlightColors[state.colorIdx];
  let bf = 0.45 + (state.brightness / 8) * 0.55;
  if (state.dimOnDrive && state.driving) bf *= 0.65;
  lcd.style.filter = `brightness(${bf.toFixed(2)}) contrast(${(0.8 + state.contrast * 0.08).toFixed(2)})`;
  if (state.inverted) lcd.classList.add('inverted');

  if (state.sleepStage === 1) { lcd.classList.add('sleep-stage1'); r1.textContent = '  www.nrdrive.ru  '; r2.textContent = '                  '; return; }
  if (state.sleepStage === 2) { lcd.classList.add('sleep-stage2'); r1.textContent = ''; r2.textContent = ''; return; }

  if (state.alertActive) {
    if (!state.alertLatched) lcd.classList.add('alert-red');
    r1.textContent = state.alertLine1; r2.textContent = state.alertLine2;
    return;
  }

  if (state.uiMode === 'eject_1') { r1.textContent = `${state.ejectSlot} Извлечение`; r2.textContent = `карты...`; return; }
  if (state.uiMode === 'eject_place') { r1.textContent = `Место конца:`; r2.textContent = `      [RUS]      ↕`; return; }
  if (state.uiMode === 'mode_select') {
    const m = state.modeSelectSlot === 1 ? state.mode1 : state.mode2;
    r1.textContent = `${state.modeSelectSlot} Вид деят-ти:`; r2.textContent = `   [ ${symbols[m]} ${modeNames[m]} ]`; return;
  }

  const activeKey = state.activeAuthSlot === 1 ? state.slot1Key : state.slot2Key;
  const curCard = cardProfiles[activeKey] || cardProfiles.driver1;

  if (state.uiMode === 'pin') {
    if (state.pinStage === 'digits') {
      r1.textContent = `${state.activeAuthSlot} Введите ПИН`;
      let mask = '';
      for (let i = 0; i < 4; i++) {
        if (i < state.pinInput.length) mask += '* ';
        else if (i === state.pinInput.length) mask += `[${state.pinVal}] `;
        else mask += '_ ';
      }
      r2.textContent = mask.trim();
    } else if (state.pinStage === 'confirm') {
      r1.textContent = `${state.activeAuthSlot} Введите ПИН`; r2.textContent = `****          (OK)`;
    } else if (state.pinStage === 'error') {
      const rem = 3 - curCard.pinAttempts;
      r1.textContent = `! ПИН НЕ ВЕРЕН!`;
      r2.textContent = rem === 2 ? `Осталось 2 шанса` : (rem === 1 ? `Остался 1 шанс` : `Карта заблокир.!`);
    } else if (state.pinStage === 'puk_ask') {
      r1.textContent = `Ввести PUK-код?`; r2.textContent = state.pukYes ? `      [Да]       ↕` : `      [Нет]      ↕`;
    } else if (state.pinStage === 'puk_entry') {
      r1.textContent = `PUK (12345678):`; r2.textContent = '*'.repeat(state.pukInput.length) + `[${state.pinVal}]`;
    }
    return;
  }

  if (state.uiMode === 'welcome_1') { r1.textContent = `${state.activeAuthSlot} Здравствуйте,`; r2.textContent = curCard.greet; return; }
  if (state.uiMode === 'welcome_2') { r1.textContent = `${state.activeAuthSlot} Срок действия`; r2.textContent = `карты ${curCard.expiry}`; return; }
  if (state.uiMode === 'welcome_3') { r1.textContent = `${state.activeAuthSlot} Посл. использ.`; r2.textContent = curCard.lastUsed; return; }
  if (state.uiMode === 'welcome_export') { r1.textContent = `🔔 Пора выгрузить`; r2.textContent = `данные с карты`; return; }
  if (state.uiMode === 'welcome_place') { r1.textContent = `Место начала:`; r2.textContent = `      [RUS]      ↕`; return; }
  if (state.uiMode === 'ask_manual') { r1.textContent = `Ручной ввод?`; r2.textContent = state.manualYes ? `      [Да]       ↕` : `      [Нет]      ↕`; return; }
  if (state.uiMode === 'manual_IdleWarn') { r1.textContent = `! Осуществите`; r2.textContent = `ручной ввод!`; return; }
  if (state.uiMode === 'manual_fmt') { r1.textContent = `Формат времени`; r2.textContent = state.manualUtc ? ` [Время UTC(SU)] ↕` : ` [Местное время] ↕`; return; }
  if (state.uiMode === 'manual_edit') {
    r1.textContent = `12/11 [${symbols[state.manualAct]}] 13/11`;
    r2.textContent = `19:40  ${modeNames[state.manualAct].slice(0,5).padEnd(5,' ')} ${state.manualEndStr.slice(6)}`;
    return;
  }
  if (state.uiMode === 'manual_confirm') { r1.textContent = `Подтверд. ввод?`; r2.textContent = state.manualYes ? `      [Да]       ↕` : `      [Нет]      ↕`; return; }
  if (state.uiMode === 'ready_drive') { r1.textContent = `◉   Готов к`; r2.textContent = `   управлению`; return; }

  if (state.uiMode === 'report_wiz') { renderReportWizard(r1, r2); return; }
  if (state.uiMode === 'param_edit') { renderParamEdit(r1, r2); return; }
  if (state.uiMode === 'test_run') { renderTestRun(r1, r2); return; }
  if (state.uiMode === 'simple_info') { return; }

  if (state.uiMode === 'menu') { const m = getMenu(); r1.textContent = `ГЛАВНОЕ МЕНЮ:`; r2.textContent = `${m[state.menuIdx].title} ↕`; return; }
  if (state.uiMode === 'sub') { const m = getMenu(); r1.textContent = m[state.menuIdx].title; r2.textContent = `${m[state.menuIdx].items[state.subIdx].name} ↕`; return; }

  const op = getOperatingMode();
  const c1 = t1 ? '1▊' : '1_', c2 = t2 ? '2▊' : '2_';
  const s1 = state.driving ? '◉' : symbols[state.mode1], s2 = symbols[state.mode2];
  const remDrive = Math.max(0, state.maxDriveTime - state.driveCont1);
  let rightBottom = `${fClk(state.clock)}${op.icon}`;
  if (state.isOut) rightBottom = `   OUT`;
  else if (state.isFerry) rightBottom = `${fClk(state.clock)}⛴`;

  switch (state.screenIdx) {
    case 0: r1.textContent = `${c1}${s1} ${fDur(state.dur1)}◉‖${fDur(remDrive)}◉`; r2.textContent = `${c2}${s2} ${fDur(state.dur2)}  ${rightBottom}`; break;
    case 1: r1.textContent = `${c1}${s1} ${fDur(state.dur1)}  ‖${fDur(state.breakSum1)}`; r2.textContent = `${c2}${s2} ${fDur(state.dur2)}  ${rightBottom}`; break;
    case 2: r1.textContent = `1◉${fDur(state.driveCont1)} ◉|0${fDur(state.week1Drive1)}`; r2.textContent = `◉►${fDur(state.shiftDrive1)} ◉‖0${fDur(state.week2Drive1)}`; break;
    case 3: r1.textContent = `2◉${fDur(state.driveCont2)}  ‖ ${fDur(state.breakSum2)}`; r2.textContent = `◉►${fDur(state.shiftDrive2)} ◉‖0${fDur(state.week2Drive2)}`; break;
    case 4:
      const utcMins = state.clock - state.tz * 60, secStr = String(state.seconds).padStart(2, '0');
      r1.textContent = `${fClk(state.clock)}•       ${state.dateStr}`; r2.textContent = `${fClk(utcMins)}:${secStr}      ${state.yearStr}`;
      break;
    case 5:
      const spdStr = String(state.driving ? state.currentSpeed : 0).padStart(3, '0'), odoStr = state.odo.toFixed(1).padStart(9, ' ');
      r1.textContent = `${c1}  ${spdStr}км/ч     ${op.icon}`; r2.textContent = `${c2} ${odoStr}км`;
      break;
    case 6:
      const gnssSpd = String(state.driving ? state.currentSpeed : 0).padStart(3, ' ');
      r1.textContent = `56.83892сш|  ${gnssSpd}`; r2.textContent = `60.60570вд| км/ч`;
      break;
  }
}

function startHold(slot) {
  wakeUp();
  if (state.driving) { triggerAlert('! Запрещено во', 'время движения', '129', 3000); return; }
  state.holdSlot = slot;
  state.holdStartTime = Date.now();
  if (state.holdTimer) clearTimeout(state.holdTimer);

  state.holdTimer = setTimeout(() => {
    const hasCard = slot === 1 ? state.slot1Key : state.slot2Key;
    if (!hasCard) { state.holdSlot = null; beep(600, 0.1); render(); return; }
    vibrate(40); beep(2100, 0.12);
    state.ejectSlot = slot; state.uiMode = 'eject_1'; state.holdSlot = null; render();
    setTimeout(() => {
      if (getSlotType(slot) === 'driver') {
        state.uiMode = 'eject_place'; render();
        state.holdTimer = setTimeout(() => { finishCardEject(slot); }, 5000);
      } else finishCardEject(slot);
    }, 1600);
  }, 1500);
}

function endHold(slot) {
  if (!state.holdSlot || state.holdSlot !== slot) return;
  const elapsed = Date.now() - state.holdStartTime;
  if (state.holdTimer) { clearTimeout(state.holdTimer); state.holdTimer = null; }
  state.holdSlot = null;

  if (elapsed < 1450 && !state.driving) {
    initAudio(); beep(1850, 0.04); vibrate(15);
    if (state.uiMode === 'mode_select' && state.modeSelectSlot === slot) {
      if (slot === 1) { state.mode1 = (state.mode1 + 1) % 3; state.dur1 = 0; }
      else { state.mode2 = (state.mode2 + 1) % 3; state.dur2 = 0; }
    } else {
      state.uiMode = 'mode_select'; state.modeSelectSlot = slot;
    }
    if (state.modeSelectTimer) clearTimeout(state.modeSelectTimer);
    state.modeSelectTimer = setTimeout(() => {
      if (state.uiMode === 'mode_select') { state.uiMode = 'main'; beep(2200, 0.06); render(); }
    }, 3000);
    render();
  }
}

function cancelHold(slot) {
  if (state.holdSlot === slot) { if (state.holdTimer) clearTimeout(state.holdTimer); state.holdSlot = null; }
}

function finishCardEject(slot) {
  if (state.holdTimer) { clearTimeout(state.holdTimer); state.holdTimer = null; }
  if (slot === 1) state.slot1Key = null;
  else state.slot2Key = null;
  updateSimCardButtons();
  state.uiMode = 'main'; beep(1500, 0.15); render();
}

function toggleSlotCard(slot) {
  wakeUp();
  const currentKey = slot === 1 ? state.slot1Key : state.slot2Key;
  if (currentKey) {
    if (state.driving) { triggerAlert('! Запрещено во', 'время движения', '129', 3000); return; }
    state.ejectSlot = slot; state.uiMode = 'eject_1'; render();
    setTimeout(() => finishCardEject(slot), 1200);
    return;
  }

  const chosenKey = document.getElementById(slot === 1 ? 'selSlot1' : 'selSlot2').value;
  const chosenCard = cardProfiles[chosenKey];

  // По п. 11.1.1: если тахограф не активирован, он принимает только карту мастерской
  if (!state.activated && chosenCard.type !== 'workshop') {
    triggerAlert('! Тахограф не', 'активирован!', '01', 3000);
    return;
  }

  if (slot === 1) state.slot1Key = chosenKey;
  else state.slot2Key = chosenKey;
  updateSimCardButtons();

  if (state.driving) {
    triggerAlert('1!◉ Ввод карты', 'во время управ', '05');
    return;
  }

  // Проверка ПИН-кода 1234 для любой вставленной карты
  state.activeAuthSlot = slot;
  if (chosenCard.blocked) {
    state.uiMode = 'pin'; state.pinStage = 'puk_ask'; state.pukYes = true;
  } else {
    state.uiMode = 'pin'; state.pinStage = 'digits'; state.pinInput = ''; state.pinVal = 1;
  }
  render();
}

function updateSimCardButtons() {
  document.getElementById('card1Btn').textContent = state.slot1Key ? '⏏ Извлечь из Слота 1' : '📥 Вставить в Слот 1';
  document.getElementById('card2Btn').textContent = state.slot2Key ? '⏏ Извлечь из Слота 2' : '📥 Вставить в Слот 2';
}

function swapDriverCards() {
  wakeUp();
  if (state.driving) { triggerAlert('! Запрещено во', 'время движения', '129', 3000); return; }
  state.slot1Key = 'driver2'; state.slot2Key = 'driver1';
  state.mode1 = 1; state.mode2 = 2;
  updateSimCardButtons(); beep(2100, 0.12);
  showSimpleInfo('Смена водителей:', 'В1: ' + cardProfiles[state.slot1Key].greet);
}

function startWelcomeSequence() {
  const op = getOperatingMode();
  if (op.conflict) { triggerAlert('! Конфликт', 'карт', '02'); return; }

  const key = state.activeAuthSlot === 1 ? state.slot1Key : state.slot2Key;
  const c = cardProfiles[key] || cardProfiles.driver1;
  state.uiMode = 'welcome_1'; render();

  setTimeout(() => {
    if (state.uiMode !== 'welcome_1') return;
    state.uiMode = 'welcome_2'; render();
    setTimeout(() => {
      if (state.uiMode !== 'welcome_2') return;
      if (c.type !== 'driver') {
        if (c.type === 'company' && !state.dataLocked) {
          openParamEdit('lock');
        } else {
          showSimpleInfo('РЕЖИМ: ' + op.label.toUpperCase(), c.fullName.slice(0, 16));
          setTimeout(() => { if (state.uiMode === 'simple_info') { state.uiMode = 'main'; render(); } }, 1800);
        }
        return;
      }
      state.uiMode = 'welcome_3'; render();
      setTimeout(() => {
        if (state.uiMode !== 'welcome_3') return;
        state.uiMode = c.daysSinceExport >= 28 ? 'welcome_export' : 'welcome_place';
        render();
      }, 1600);
    }, 1600);
  }, 1600);
}

function resetManualIdleTimer() {
  if (state.manualIdleTimer) clearTimeout(state.manualIdleTimer);
  if (state.manualWarnTimer) clearTimeout(state.manualWarnTimer);
  const manualModes = ['ask_manual', 'manual_fmt', 'manual_edit', 'manual_confirm'];
  if (!manualModes.includes(state.uiMode)) return;
  state.manualIdleTimer = setTimeout(() => {
    const prevMode = state.uiMode;
    state.uiMode = 'manual_IdleWarn'; beep(1200, 0.15); render();
    state.manualWarnTimer = setTimeout(() => {
      if (state.uiMode === 'manual_IdleWarn') { state.unknownSum1 += 60; state.uiMode = 'main'; render(); }
    }, 4000);
    state.prevManualMode = prevMode;
  }, 30000);
}

function btnPress(b) {
  vibrate(15);
  if (state.sleepStage > 0) { wakeUp(true); return; }
  resetSleepTimer(); initAudio();

  if (state.alertActive) {
    if (!state.alertLatched) { silenceAlertBuzzer(); beep(1800, 0.04); return; }
    if (b === 'ok' || b === 'back') { clearAlert(); beep(2000, 0.05); return; }
    return;
  }
  if (state.uiMode === 'test_run' && state.currentTestType === 'keys') { handleKeyTestPress(b); return; }
  beep(1850, 0.04);

  if (state.uiMode === 'manual_IdleWarn') { state.uiMode = state.prevManualMode || 'ask_manual'; resetManualIdleTimer(); render(); return; }
  if (state.uiMode === 'eject_place') { if (b === 'ok') finishCardEject(state.ejectSlot); return; }

  if (state.uiMode === 'mode_select') {
    if (b === 'up') { if (state.modeSelectSlot === 1) state.mode1 = (state.mode1 + 1) % 3; else state.mode2 = (state.mode2 + 1) % 3; }
    else if (b === 'down') { if (state.modeSelectSlot === 1) state.mode1 = (state.mode1 + 2) % 3; else state.mode2 = (state.mode2 + 2) % 3; }
    else if (b === 'ok' || b === 'back') { if (state.modeSelectTimer) clearTimeout(state.modeSelectTimer); state.uiMode = 'main'; }
    render(); return;
  }

  if (state.uiMode === 'pin') {
    const key = state.activeAuthSlot === 1 ? state.slot1Key : state.slot2Key;
    const c = cardProfiles[key] || cardProfiles.driver1;
    if (state.pinStage === 'digits') {
      if (b === 'up') state.pinVal = (state.pinVal + 1) % 10;
      else if (b === 'down') state.pinVal = (state.pinVal + 9) % 10;
      else if (b === 'back' && state.pinInput.length > 0) state.pinInput = state.pinInput.slice(0, -1);
      else if (b === 'ok') {
        state.pinInput += String(state.pinVal); state.pinVal = 1;
        if (state.pinInput.length === 4) state.pinStage = 'confirm';
      }
    } else if (state.pinStage === 'confirm') {
      if (b === 'back') { state.pinInput = state.pinInput.slice(0, -1); state.pinStage = 'digits'; }
      else if (b === 'ok') {
        if (state.pinInput === c.pin) { c.pinAttempts = 0; beep(2300, 0.12); startWelcomeSequence(); return; }
        else { c.pinAttempts++; beep(450, 0.3); if (c.pinAttempts >= 3) c.blocked = true; state.pinStage = 'error'; }
      }
    } else if (state.pinStage === 'error') {
      if (b === 'ok') {
        if (c.blocked) { state.pinStage = 'puk_ask'; state.pukYes = true; }
        else { state.pinInput = ''; state.pinVal = 1; state.pinStage = 'digits'; }
      }
    } else if (state.pinStage === 'puk_ask') {
      if (b === 'up' || b === 'down') state.pukYes = !state.pukYes;
      else if (b === 'ok') {
        if (state.pukYes) { state.pinStage = 'puk_entry'; state.pukInput = ''; state.pinVal = 1; }
        else finishCardEject(state.activeAuthSlot);
      }
    } else if (state.pinStage === 'puk_entry') {
      if (b === 'up') state.pinVal = (state.pinVal + 1) % 10;
      else if (b === 'down') state.pinVal = (state.pinVal + 9) % 10;
      else if (b === 'back') state.pukInput = state.pukInput.slice(0, -1);
      else if (b === 'ok') {
        state.pukInput += String(state.pinVal);
        if (state.pukInput.length === 8) {
          if (state.pukInput === c.puk) { c.blocked = false; c.pinAttempts = 0; beep(2300, 0.15); startWelcomeSequence(); return; }
          else { triggerAlert('! КАРТА', 'НЕДЕЙСТВИТЕЛЬНА', '01'); finishCardEject(state.activeAuthSlot); return; }
        }
      }
    }
    render(); return;
  }

  if (state.uiMode === 'welcome_1') { if (b === 'ok') state.uiMode = 'welcome_2'; render(); return; }
  if (state.uiMode === 'welcome_2') { if (b === 'ok') state.uiMode = 'welcome_3'; render(); return; }
  if (state.uiMode === 'welcome_3') { if (b === 'ok') state.uiMode = 'welcome_place'; render(); return; }
  if (state.uiMode === 'welcome_export') { if (b === 'ok') state.uiMode = 'welcome_place'; render(); return; }
  if (state.uiMode === 'welcome_place') { if (b === 'ok') { state.uiMode = 'ask_manual'; state.manualYes = true; resetManualIdleTimer(); } render(); return; }

  if (state.uiMode === 'ask_manual') {
    resetManualIdleTimer();
    if (b === 'up' || b === 'down') state.manualYes = !state.manualYes;
    else if (b === 'ok') {
      if (state.manualYes) { state.uiMode = 'manual_fmt'; state.manualUtc = false; }
      else { state.unknownSum1 += 60; showReadyToDrive(); return; }
    }
    render(); return;
  }
  if (state.uiMode === 'manual_fmt') {
    resetManualIdleTimer();
    if (b === 'up' || b === 'down') state.manualUtc = !state.manualUtc;
    else if (b === 'back') state.uiMode = 'ask_manual';
    else if (b === 'ok') { state.uiMode = 'manual_edit'; state.manualAct = 0; }
    render(); return;
  }
  if (state.uiMode === 'manual_edit') {
    resetManualIdleTimer();
    if (b === 'up') state.manualAct = (state.manualAct + 1) % 4;
    else if (b === 'down') state.manualAct = (state.manualAct + 3) % 4;
    else if (b === 'back') state.uiMode = 'manual_fmt';
    else if (b === 'ok') { state.uiMode = 'manual_confirm'; state.manualYes = true; }
    render(); return;
  }
  if (state.uiMode === 'manual_confirm') {
    resetManualIdleTimer();
    if (b === 'up' || b === 'down') state.manualYes = !state.manualYes;
    else if (b === 'back') state.uiMode = 'manual_edit';
    else if (b === 'ok') {
      if (state.manualIdleTimer) clearTimeout(state.manualIdleTimer);
      if (state.manualYes) {
        if (state.manualAct === 0) state.restSum1 += 120; else if (state.manualAct === 1) state.workSum1 += 60;
        showReadyToDrive(); return;
      } else state.uiMode = 'manual_edit';
    }
    render(); return;
  }

  if (state.driving && (b === 'ok' || state.uiMode !== 'main')) {
    triggerAlert('! Запрещено во', 'время движения', '129', 3000); state.uiMode = 'main'; return;
  }
  if (state.uiMode === 'report_wiz') { handleReportWizardBtn(b); return; }
  if (state.uiMode === 'param_edit') { handleParamEditBtn(b); return; }
  if (state.uiMode === 'test_run' || state.uiMode === 'simple_info') { if (b === 'ok' || b === 'back') { state.uiMode = 'main'; render(); } return; }

  const m = getMenu();
  if (b === 'ok') {
    if (state.uiMode === 'main') { state.uiMode = 'menu'; state.menuIdx = 0; }
    else if (state.uiMode === 'menu') { state.uiMode = 'sub'; state.subIdx = 0; }
    else if (state.uiMode === 'sub') { m[state.menuIdx].items[state.subIdx].act(); return; }
  } else if (b === 'back') {
    if (state.uiMode === 'sub') state.uiMode = 'menu';
    else if (state.uiMode === 'menu') state.uiMode = 'main';
    else closeReceipt();
  } else if (b === 'up') {
    if (state.uiMode === 'main') state.screenIdx = (state.screenIdx + 6) % 7;
    else if (state.uiMode === 'menu') state.menuIdx = (state.menuIdx + m.length - 1) % m.length;
    else if (state.uiMode === 'sub') { const len = m[state.menuIdx].items.length; state.subIdx = (state.subIdx + len - 1) % len; }
  } else if (b === 'down') {
    if (state.uiMode === 'main') state.screenIdx = (state.screenIdx + 1) % 7;
    else if (state.uiMode === 'menu') state.menuIdx = (state.menuIdx + 1) % m.length;
    else if (state.uiMode === 'sub') { const len = m[state.menuIdx].items.length; state.subIdx = (state.subIdx + 1) % len; }
  }
  render();
}

  else if (p === 'ws_speed') { r1.textContent = 'Макс. скорость:'; r2.textContent = `    ${state.speedLimit} км/ч    ↕`; }
  else if (p === 'ws_act') { r1.textContent = 'Активация БУ:'; r2.textContent = state.activated ? ' [Активирован]  ↕' : ' [Режим изгот.] ↕'; }
  else if (p === 'usb_menu') { r1.textContent = 'Выгрузка на USB'; r2.textContent = `[${usbExportItems[state.usbExportType]}]↕`; }
}

function handleParamEditBtn(b) {
  const p = state.currentParam;
  if (b === 'back') { state.uiMode = 'sub'; render(); return; }
  if (b === 'ok') {
    if (p === 'lock') {
      const op = getOperatingMode().mode;
      if (op !== 'company' && op !== 'workshop') { triggerAlert('! Нужна карта', 'предприятия', null, 2500); state.uiMode = 'main'; return; }
      state.dataLocked = !state.dataLocked; showSimpleInfo('🔔 Выполнено!', state.dataLocked ? 'Т Заблокировано' : 'Т Разблокировано'); return;
    }
    if (p === 'usb_menu') {
      const op = getOperatingMode().mode;
      if (state.usbExportType > 0 && op === 'work') { triggerAlert('! Нужна спецкарта', 'Предпр/Контр/Маст', null, 2800); return; }
      quickUsbExport(); return;
    }
    beep(2100, 0.08); state.uiMode = 'sub'; render(); return;
  }
  const dir = b === 'up' ? 1 : -1;
  if (p === 'brightness') state.brightness = Math.min(8, Math.max(1, state.brightness + dir));
  else if (p === 'color') state.colorIdx = (state.colorIdx + dir + 7) % 7;
  else if (p === 'dim') state.dimOnDrive = !state.dimOnDrive;
  else if (p === 'invert') state.inverted = !state.inverted;
  else if (p === 'contrast') state.contrast = Math.min(8, Math.max(1, state.contrast + dir));
  else if (p === 'sound') state.soundTone = (state.soundTone + dir + 4) % 4;
  else if (p === 'local_time') { state.tz = Math.min(12, Math.max(-12, state.tz + dir)); state.clock = (state.clock + dir * 60 + 1440) % 1440; }
  else if (p === 'utc_corr') state.clock = (state.clock + dir + 1440) % 1440;
  else if (p === 'auto_rest') state.autoRest = !state.autoRest;
  else if (p === 'ex_mode') state.exMode = !state.exMode;
  else if (p === 'ws_odo') state.odo = Math.max(0, state.odo + dir * 100);
  else if (p === 'ws_w') state.workshopData.wFactor = Math.max(4000, state.workshopData.wFactor + dir * 100);
  else if (p === 'ws_speed') state.speedLimit = Math.min(130, Math.max(60, state.speedLimit + dir * 5));
  else if (p === 'ws_act') state.activated = !state.activated;
  else if (p === 'usb_menu') state.usbExportType = (state.usbExportType + dir + 4) % 4;
  render();
}

function startReportWizard(type) { state.reportPending = { type: type, step: 0, slot: 1, date: '2026.11.13', utc: true, out: 0 }; state.uiMode = 'report_wiz'; render(); }
function renderReportWizard(r1, r2) {
  const rp = state.reportPending, outModes = ['▼ Печать', '▯ Дисплей', '🔌 USB-накопит.'];
  if (rp.step === 0) { r1.textContent = 'Выбрать карту'; r2.textContent = `   [Карта ${rp.slot}]    ↕`; }
  else if (rp.step === 1) { r1.textContent = 'Введите дату'; r2.textContent = `  [${rp.date}]  ↕`; }
  else if (rp.step === 2) { r1.textContent = 'Время отчета'; r2.textContent = rp.utc ? ' [Время UTC(SU)]↕' : ' [Местное время]↕'; }
  else if (rp.step === 3) { r1.textContent = 'Способ вывода'; r2.textContent = ` [${outModes[rp.out]}] ↕`; }
}
function handleReportWizardBtn(b) {
  const rp = state.reportPending;
  if (b === 'back') { if (rp.step > 0) { rp.step--; render(); } else { state.uiMode = 'sub'; render(); } return; }
  if (b === 'up' || b === 'down') {
    if (rp.step === 0) rp.slot = rp.slot === 1 ? 2 : 1;
    else if (rp.step === 2) rp.utc = !rp.utc;
    else if (rp.step === 3) rp.out = (rp.out + (b === 'up' ? 1 : 2)) % 3;
    render(); return;
  }
  if (b === 'ok') {
    if (rp.step < 3) { rp.step++; render(); }
    else { state.uiMode = 'main'; if (rp.out === 2) quickUsbExport(); else printReport(rp.type); }
  }
}

  const nkmFooter = `------------------НКМ-------------------\n📅 ${state.fullDate} ${utcStr}:04\n🌐 56.83892104 с.ш. / 60.60570112 в.д.\nСрок действия:               ${ws.nkmExpiry}\nЗав.№: ${ws.nkmNum} (№ в перечне: 5)\n----------------------------------------\n      ▄▄▄▄▄▄▄  ▄ ▄▄  ▄▄▄▄▄▄▄\n      █ ▄▄▄ █ ██▀▄█  █ ▄▄▄ █\n      █▄▄▄▄▄█ █ ▄ █  █▄▄▄▄▄█\n----------------------------------------\nП ________________ (Место контроля)\n◉ ________________ (Подпись водителя)`;

  if (type === 'test_print') front.textContent = `                  НРД\n▼ ${state.fullDate} ${utcStr} UTC_SU\n----------------------------------------\n !"#$%&'()*+,-./0123456789:;<=>?@\n ABCDEFGHIJKLMNOPQRSTUVWXYZ\n АБВГДЕЖЗИЙКЛМНОПРСТУФХЦЧШЩЪЫЬЭЮЯ\n----------------------------------------\nТест принтера                         ОК`;
  else if (type === 'preflight') front.textContent = `                  НРД\n▼ ${state.fullDate} ${utcStr} UTC_SU\nПредрейсовый тест (${ws.serial})\n----------------------------------------\nFirmware Test: OK | Дисплей:          OK\nПодсветка:     OK | Напр. батарейки:  OK\nНапр. питания: OK | СКЗИ готовность:  OK\nДанные ГНСС:   OK | Наличие бумаги:   OK\nПринтер:       OK | Отсутств.вскрытия:OK\nКлавиатура:    OK | Датчик скорости:  OK\nВход зажиган.: OK | Карта 1 обмен:    OK\n----------------------------------------\nНапр. бат.: 3.1 В | Напр. пит.:  24.2 В\nТемп. пр.: +26 °C | CAN 1 отпр.: 000412\n🌐 56.83892104 с.ш. / 60.60570112 в.д.\nВсе системы:                          OK ✔`;
  else if (type === 'tech') front.textContent = `                  НРД\n▼ ${state.fullDate} ${utcStr} UTC_SU\n-----------Т ⚙ ▼ (Тех. данные)----------\n◉ ${d1.fullName}\n◉▊${d1.cardNum} (до ${d1.expiry})\nД ${ws.vin} | ${ws.plate}\n🏭 ООО "НОВЫЕ РЕШЕНИЯ ДРАЙВА" Drive Smart\n   S/N: ${ws.serial} | ПО: ${ws.fw}\n⚒ ИП "Сизенок И.Е." | w=${ws.wFactor} k=${ws.kFactor}\n  l=${ws.lWheel}мм | Шины: ${ws.tire} | >> ${state.speedLimit}км/ч\n${nkmFooter}`;
  else if (type === 'speed_graph') front.textContent = `                  НРД\n▼ ${state.fullDate} ${utcStr} UTC_SU (Скорости ▼)\nД ${ws.vin} (${ws.plate})\n----------------------------------------\n     0    30    60    90   120 km/h\n08:00|█    .     .     .     .  h\n09:00|█████████████████.     .  ◉\n10:00|███████████████████    .  ◉\n11:00|█    .     .     .     .  ⚒\n12:00|█    .     .     .     .  h\n13:00|████████████████ .     .  ◉\n----------------------------------------`;
  else if (type === 'events_card' || type === 'events_v') {
    let evLines = ''; state.eventLog.slice(0, 5).forEach((e, i) => { evLines += `!0${i} ${e.date} ${e.time} | Код !${e.code}\n   ${e.msg} (${e.dur})\n`; });
    front.textContent = `                  НРД\n▼ ${state.fullDate} ${utcStr} UTC_SU (! ⚒ ▼)\n◉ ${d1.fullName}\nД ${ws.vin} (${ws.plate})\n----------------------------------------\n${evLines}${nkmFooter}`;
  } else if (type === 'speed_over') front.textContent = `                  НРД\n▼ ${state.fullDate} ${utcStr} UTC_SU (>> ▼ ${state.speedLimit} км/ч)\n◉ ${d1.fullName}\n>> ${state.fullDate} ${utcStr} 00ч02 ${Math.max(95, state.currentSpeed)}км/ч\n${nkmFooter}`;
  else if (type === 'time_corr') front.textContent = `                  НРД\n▼ ${state.fullDate} ${utcStr} UTC_SU\nАвт. коррект. времени ▼\nНет авто. корректировок времени\n${nkmFooter}`;
  else if (type === 'nkm') front.textContent = `                  НРД\n▼ ${state.fullDate} ${utcStr} UTC_SU (🔒 НКМ)\nЗав.№:${ws.nkmNum}\n+НКМ инициализирован | +ТС активировано\n+ГНСС готов          | +КриптоПроц. готов\nВерсия: nkm ver 2.11 | Замена: ${ws.nkmExpiry}`;
  else if (type === 'gsm' || type === 'conn') front.textContent = `                  НРД\n----Модем / Подключения----\nIMEI: 860000000000000 | MegaFon -54 dBm\nWialon IPS 2.0: Вкл | ДУТ 1: LLS 4 (481)`;
  else {
    const startOdo = (state.odo - state.dailyDistance).toFixed(0), endOdo = state.odo.toFixed(0);
    front.textContent = `                  НРД\n▼ ${state.fullDate} ${utcStr} UTC_SU\n---------24h▊▼ (Суточный отчет)---------\n◉ ${d1.fullName}\n◉▊${d1.cardNum} (до ${d1.expiry})\nД ${ws.vin} (${ws.plate})\n------------1 (Слот водителя)-----------\nНачало: ${startOdo} км\nh 00:00  08ч00\n⚒ 08:00  ${fDur(state.workSum1)}\n◉ 08:45  ${fDur(state.driveCont1)}\nh 13:00  ${fDur(state.breakSum1)}\nКонец: ${endOdo} км; Пробег: ${state.dailyDistance.toFixed(0)} км\n-------------------Σ--------------------\n◉ ${fDur(state.shiftDrive1)} (${state.dailyDistance.toFixed(0)} км) | ⚒ ${fDur(state.workSum1)}\nh ${fDur(state.restSum1)} | ☒ ${fDur(state.dur2)} | ? ${fDur(state.unknownSum1)}\n◀|▶ 08:00 RUS (${startOdo} км)\n${nkmFooter}`;
  }

  back.innerHTML = `<div style="border:1px solid #cbd5e1;padding:10px;border-radius:4px;background:#fff;">
    <div style="color:#dc2626;font-weight:900;font-size:18px;">НРД — Тахографическая термобумага (п. 11.1.8)</div>
    <div style="font-size:11.5px;margin:5px 0;"><b>◉ ФИО:</b> ${d1.fullName} | <b>◉▊ Карта:</b> ${d1.cardNum.slice(4,20)} | <b>Д ТС:</b> А777АА196 | <b>Дата:</b> ${state.fullDate}</div>
    <svg viewBox="0 0 360 95" style="width:100%;border:1px solid #64748b;background:#f8fafc;">
      <g stroke="#cbd5e1" stroke-width="1">${Array.from({length: 25}, (_, i) => `<line x1="${30 + i*13}" y1="12" x2="${30 + i*13}" y2="85"/>`).join('')}</g>
      <text x="6" y="26" font-size="9">◉</text><text x="6" y="44" font-size="9">⚒</text><text x="6" y="62" font-size="9">☒</text><text x="6" y="80" font-size="9">h</text>
      <polyline fill="none" stroke="#dc2626" stroke-width="2.5" points="30,78 134,78 134,42 147,42 147,24 186,24 186,78 212,78 212,24 251,24 251,78 342,78"/>
    </svg>
    <div style="margin-top:5px;font-size:11.5px;display:flex;justify-content:space-between;"><span>08–09 ⚒ | 09–12 ◉ | 12–14 h | 14–17 ◉</span><span><b>Подпись:</b> <i>/Гарион А.Ю./</i></span></div>
  </div>`;
}

function flipReceipt() { vibrate(); const w = document.getElementById('receiptArea'); w.classList.toggle('flipped'); }
function closeReceipt() { document.getElementById('receiptArea').style.display = 'none'; }

function checkRTOAndDrivingRules() {
  if (state.driving) {
    if (getSlotType(1) !== 'driver') {
      if (!state.noCardWarnShown) { state.noCardWarnShown = true; triggerAlert('1!◉ Управление', 'без соотв. карты', '04'); }
    } else state.noCardWarnShown = false;
    if (state.driveCont1 >= state.maxDriveTime && !state.limitWarnShown) {
      state.limitWarnShown = true; triggerAlert('◉‖ Лимит вождения', 'превышен!', null);
    } else if (state.driveCont1 >= state.maxDriveTime - 15 && state.driveCont1 < state.maxDriveTime && !state.preWarnShown) {
      state.preWarnShown = true; triggerAlert('◉‖ До перерыва', '15 минут.', null);
    }
  }
}

function toggleDrive() {
  wakeUp();
  if (!state.ignition && !state.driving) { state.ignition = true; document.getElementById('ignBtn').textContent = '🔑 Зажигание: ВКЛ'; }
  state.driving = !state.driving; state.dur1 = 0;
  if (state.driving) {
    state.mode1 = 3; if (getSlotType(2) === 'driver') state.mode2 = 2;
    state.currentSpeed = 78; if (state.isFerry) state.isFerry = false;
    if (state.uiMode !== 'main') state.uiMode = 'main';
    document.getElementById('driveBtn').textContent = '🛑 Остановить ТС'; document.getElementById('driveBtn').className = 'sim-btn red';
  } else {
    state.mode1 = 1; if (getSlotType(2) === 'driver') state.mode2 = 2; state.currentSpeed = 0;
    document.getElementById('driveBtn').textContent = '🚛 Начать движение'; document.getElementById('driveBtn').className = 'sim-btn green';
  }
  checkRTOAndDrivingRules(); render();
}

function toggleIgnition() {
  if (state.driving) { triggerAlert('! Остановите ТС', 'перед выкл. заж.', null, 2500); return; }
  state.ignition = !state.ignition;
  document.getElementById('ignBtn').textContent = state.ignition ? '🔑 Зажигание: ВКЛ' : '🔑 Зажигание: ВЫКЛ';
  if (!state.ignition) { if (state.autoRest) { state.mode1 = 0; state.mode2 = 0; } resetSleepTimer(); } else wakeUp(true);
  render();
}

function triggerSpeeding() { wakeUp(); if (!state.driving) toggleDrive(); state.currentSpeed = state.speedLimit + 14; triggerAlert('>> Превышение', 'скорости', '07'); }
function simulateMalfunction() { const ks = ['06', '08', '10', '16', '23', '50', '53', '56', '132']; const c = ks[Math.floor(Math.random() * ks.length)]; triggerAlert(`!х Код ${c}:`, errorCodes[c], c); }
function resetAllFaults() {
  clearAlert(); Object.values(cardProfiles).forEach(c => { c.blocked = false; c.pinAttempts = 0; });
  state.preWarnShown = false; state.limitWarnShown = false; state.noCardWarnShown = false;
  state.driveCont1 = 120; state.breakSum1 = 45; state.uiMode = 'main'; beep(2100, 0.1); render();
}

let isDraggingDial = false;
const dialEl = document.getElementById('dial');
function syncDialHand() {
  const norm = ((state.clock % 1440) + 1440) % 1440;
  document.getElementById('dialHand').style.transform = `translate(-50%, -100%) rotate(${(norm / 1440) * 2 * Math.PI}rad)`;
  document.getElementById('dialTime').textContent = fClk(state.clock);
}
function handleDialMove(e) {
  if (!isDraggingDial) return; e.preventDefault(); wakeUp(false);
  const rect = dialEl.getBoundingClientRect(), cx = rect.left + rect.width / 2, cy = rect.top + rect.height / 2;
  const px = e.touches ? e.touches[0].clientX : e.clientX, py = e.touches ? e.touches[0].clientY : e.clientY;
  let angle = Math.atan2(py - cy, px - cx) + Math.PI / 2; if (angle < 0) angle += 2 * Math.PI;
  let delta = Math.floor((angle / (2 * Math.PI)) * 1440) - (((state.clock % 1440) + 1440) % 1440);
  if (delta < -720) delta += 1440; if (delta > 720) delta -= 1440;
  if (delta > 0) {
    state.clock = (state.clock + delta) % 1440; state.dur1 += delta;
    const selAct = parseInt(document.getElementById('ffMode').value, 10);
    if (selAct === 3) {
      state.driving = true; state.mode1 = 3; state.driveCont1 += delta; state.shiftDrive1 += delta; state.week1Drive1 += delta; state.week2Drive1 += delta;
      const km = +(delta * 1.25).toFixed(1); state.odo += km; state.dailyDistance += km;
      document.getElementById('driveBtn').textContent = '🛑 Остановить ТС'; document.getElementById('driveBtn').className = 'sim-btn red';
      checkRTOAndDrivingRules();
    } else if (selAct === 0 || selAct === 2) {
      state.mode1 = selAct; state.breakSum1 += delta; state.restSum1 += delta;
      if (state.breakSum1 >= 45) { state.driveCont1 = 0; state.preWarnShown = false; state.limitWarnShown = false; }
    } else { state.mode1 = 1; state.workSum1 += delta; }
    syncDialHand(); render();
  }
}
dialEl.addEventListener('mousedown', (e) => { isDraggingDial = true; handleDialMove(e); });
window.addEventListener('mousemove', handleDialMove); window.addEventListener('mouseup', () => { isDraggingDial = false; });
dialEl.addEventListener('touchstart', (e) => { isDraggingDial = true; handleDialMove(e); }, { passive: false });
window.addEventListener('touchmove', handleDialMove, { passive: false }); window.addEventListener('touchend', () => { isDraggingDial = false; });

setInterval(() => {
  state.seconds = (state.seconds + 1) % 60;
  if (state.seconds === 0) {
    state.clock = (state.clock + 1) % 1440; state.dur1++; state.dur2++;
    if (state.driving) { state.driveCont1++; state.shiftDrive1++; state.week1Drive1++; state.week2Drive1++; checkRTOAndDrivingRules(); }
    else if (state.mode1 === 0 || state.mode1 === 2) { state.breakSum1++; state.restSum1++; if (state.breakSum1 >= 45) { state.driveCont1 = 0; state.preWarnShown = false; state.limitWarnShown = false; } }
    else state.workSum1++;
    syncDialHand();
  }
  if (state.driving) {
    if (state.currentSpeed <= state.speedLimit) state.currentSpeed = 75 + Math.floor(Math.random() * 12);
    const stepKm = state.currentSpeed / 3600; state.odo += stepKm; state.dailyDistance += stepKm;
  }
  if (state.uiMode === 'main') render();
}, 1000);

syncDialHand(); resetSleepTimer(); render();
</script>
